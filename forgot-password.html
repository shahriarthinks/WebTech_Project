<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Connect | Forgot Password</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="container reverse">

        <div class="image-side"></div>

        <div class="form-side">

            <h3 class="brand">&#129656; Blood Bank</h3>
            <p class="small-text">Enter the email you registered with and we will send you a reset link.</p>
            <h1>Reset your <br>password <span class="arrow">&#8595;</span></h1>

            <!-- For now the form goes back to the login page.
                 Later, change action to "reset.php" and method to "post". -->
            <form action="login.html" method="get">

                <div class="input-box">
                    <span class="icon">&#9993;</span>
                    <input type="email" id="email" name="email" placeholder="Email Address" required>
                </div>

                <input type="submit" class="btn" value="Send Reset Link">

            </form>

            <p class="signin">Remembered it? <a href="login.html">Back to Login</a></p>

        </div>

    </div>

</body>
</html>
